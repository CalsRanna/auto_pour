# Tapster Configuration File
# This file defines how your package should be built and published

# 配置生成后无需再修改：版本来自远端 Release tag（tapster publish 自动解析），
# checksum 来自远端 asset digest。发版流程：改代码 → 打 tag → CI 构建 → tapster publish
name: tapster
description: A command-line tool for automating Homebrew/Scoop package publishing.
homepage: https://github.com/CalsRanna/auto_pour
repository: https://github.com/CalsRanna/auto_pour.git
license: MIT

formula:
  # brew tap CalsRanna/tap → 仓库 CalsRanna/homebrew-tap
  # 一个 tap 托管所有工具（多工具分发），不绑定 tapster 本身
  tap: CalsRanna/tap
  asset: build/tapster-macos
  linux_asset: build/tapster-linux
  # checksum 由远端 Release asset digest 权威解析（tapster publish 自动填充）
  dependencies:
    - gh

scoop:
  # scoop bucket add scoop-bucket <url> → 仓库 CalsRanna/scoop-bucket
  bucket: CalsRanna/scoop-bucket
  asset: build/tapster-windows.exe
  arch: 64bit
  # checksum 由远端 Release asset digest 权威解析（tapster publish 自动填充）
