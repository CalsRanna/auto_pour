# 被发布仓库（仓库 B）自己的发布流水线：构建 → 创建 Release → 上传 asset。
#
# 职责边界：本 CI 只碰自己（auto_pour），GITHUB_TOKEN 足够。
# 分发动作（读远端 Release 信息、生成 manifest、推送托管仓库）
# 由 tapster 在发布侧（本地，gh 已登录）完成。
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要 tag 历史（tapster 从 git tag 解析版本）

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # 1. 构建 tapster 二进制（dogfooding：用 tapster 发布 tapster）
      - name: Build tapster
        run: |
          dart pub get
          dart compile exe bin/tapster.dart -o build/tapster

      # 2. 创建 GitHub Release 并上传 asset（只碰当前仓库）
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" build/tapster --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # 3. 校验：Release asset 的 digest 应可被 tapster 读取（分发前置）
      - name: Verify release digest available
        run: |
          DIGEST="$(gh api "repos/CalsRanna/auto_pour/releases/tags/$GITHUB_REF_NAME" \
            --jq '.assets[0].digest')"
          echo "asset digest: $DIGEST"
          test -n "$DIGEST"
