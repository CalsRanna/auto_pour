# 被发布仓库（仓库 B）自己的发布流水线：构建 → 创建 Release → 上传 asset。
#
# 职责边界：本 CI 只碰自己（auto_pour），GITHUB_TOKEN 足够。
# 分发动作（读远端 Release 信息、生成 manifest、推送托管仓库）
# 由 tapster 在发布侧（本地，gh 已登录）完成。
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 先建空 Release（三个平台的 build job 并行 upload，必须先存在）
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # Dart AOT 编译不支持交叉编译：每个平台在对应 runner 上构建，
  # asset 名带平台后缀（tapster 按 asset 文件名匹配远端 digest）。
  publish:
    name: Build ${{ matrix.asset }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: tapster-macos
          - os: ubuntu-latest
            asset: tapster-linux
          - os: windows-latest
            asset: tapster-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要 tag 历史（tapster 从 git tag 解析版本）

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # 1. 构建 tapster 二进制（dogfooding：用 tapster 发布 tapster）
      - name: Build tapster
        run: |
          dart pub get
          mkdir -p build
          dart compile exe bin/tapster.dart -o build/${{ matrix.asset }}

      # 2. 上传 asset（--clobber 容忍重跑；只碰当前仓库）
      - name: Upload asset
        run: gh release upload "$GITHUB_REF_NAME" "build/${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # 3. 校验：三个平台的 asset 都在、digest 都可被 tapster 读取（分发前置）
  verify:
    name: Verify release assets
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Verify all platform assets have digests
        run: |
          ASSETS="$(gh api "repos/CalsRanna/auto_pour/releases/tags/$GITHUB_REF_NAME" \
            --jq '[.assets[] | {name: .name, digest: .digest}]')"
          echo "$ASSETS"
          NAMES="$(echo "$ASSETS" | jq -r '[.[].name] | sort | join(" ")')"
          test "$NAMES" = "tapster-linux tapster-macos tapster-windows.exe"
          test "$(echo "$ASSETS" | jq '[.[] | select(.digest == null)] | length')" -eq 0
        env:
          GH_TOKEN: ${{ github.token }}
